[project]
name = "social-manager"
version = "2.0.0"
description = "Local reusable AI video production engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
social-manager = "social_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
